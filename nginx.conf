server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome (Vite) podem ser cacheados por muito tempo sem risco de servir
    # versão velha, já que qualquer mudança de conteúdo gera um nome de arquivo novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy pra API no mesmo domínio (host mapi-api resolve pela rede interna do docker
    # compose). Isso faz front e API serem "same-origin" do ponto de vista do navegador, o que
    # é o que permite o cookie httpOnly de sessão funcionar sem SameSite=None+Secure (que
    # exigiria HTTPS mesmo em dev local).
    location /api/ {
        proxy_pass http://mapi-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html (React Router assume).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
