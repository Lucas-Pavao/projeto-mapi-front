server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome (Vite) podem ser cacheados por muito tempo sem risco de servir
    # versão velha, já que qualquer mudança de conteúdo gera um nome de arquivo novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Terreno (ADR 0008, C3): PMTiles estático (tiles PNG já coloridos) lido pelo navegador por
    # range requests. O .pmtiles NÃO está na imagem (public/terrain está no .dockerignore): monte o
    # volume em /usr/share/nginx/terrain (terrain_hypsometry.pmtiles + terrain_manifest.json,
    # gerados por `tools/terreno/run.sh tiles`). O nginx atende "Range: bytes=a-b" em arquivo
    # estático por padrão (206 + "Accept-Ranges: bytes"); "gzip off" garante que nada recomprime o
    # arquivo (tiraria o Range). ETag/Last-Modified continuam ligados (revalidação 304 barata).
    location /terrain/ {
        alias /usr/share/nginx/terrain/;
        gzip off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        types { application/octet-stream pmtiles; application/json json; }
    }

    # Proxy pra API no mesmo domínio (host mapi-api resolve pela rede interna do docker
    # compose). Isso faz front e API serem "same-origin" do ponto de vista do navegador, o que
    # é o que permite o cookie httpOnly de sessão funcionar sem SameSite=None+Secure (que
    # exigiria HTTPS mesmo em dev local).
    location /api/ {
        proxy_pass http://mapi-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stream ao vivo (SSE, ADR 0012): sem buffer e com leitura longa. O heartbeat do servidor sai a
    # cada 25 s, então 120 s de read_timeout dá folga para duas perdas seguidas. Casa exato com
    # /api/ (o "=" dá prioridade a este bloco).
    location = /api/stream {
        proxy_pass http://mapi-api:8080/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no;
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html (React Router assume).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
